name: Update eBay prices

# Refreshes grimoire-prices.json from the eBay Browse API (see tools/ebay_prices.py).
# Needs repository secrets EBAY_CLIENT_ID and EBAY_CLIENT_SECRET
# (Settings -> Secrets and variables -> Actions). Without them the job is skipped.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        if: env.EBAY_CLIENT_ID != ''
      - uses: actions/setup-python@v5
        if: env.EBAY_CLIENT_ID != ''
        with:
          python-version: '3.12'
      - name: Fetch prices
        if: env.EBAY_CLIENT_ID != ''
        run: python3 tools/ebay_prices.py
      - name: Commit updated prices
        if: env.EBAY_CLIENT_ID != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add grimoire-prices.json
          git diff --cached --quiet || { git commit -m "Update eBay prices"; git push; }
